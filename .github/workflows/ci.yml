name: CI

# Branch CI for the image catalog: lint catalog.yaml, run the tooling
# tests, and smoke-build (no push) the images whose inputs changed.
# Images build in three FROM-depth stages (lint caps chains at depth 2).
# Nothing here publishes; releases are tag-driven in release.yml.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Lint the catalog, run the tooling tests, and derive the per-stage
  # build matrices for the images whose context dirs changed. A change
  # to an image propagates to everything that FROMs it.
  catalog:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.compute.outputs.registry }}
      stage0: ${{ steps.compute.outputs.stage0 }}
      stage1: ${{ steps.compute.outputs.stage1 }}
      stage2: ${{ steps.compute.outputs.stage2 }}
      any0: ${{ steps.compute.outputs.any0 }}
      any1: ${{ steps.compute.outputs.any1 }}
      any2: ${{ steps.compute.outputs.any2 }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint catalog
        run: |
          ./catalog.sh lint
          bash catalog_test.sh
          bash gui/chromium-launch_test.sh
          bash gui/session_test.sh
      - name: Generate change filters
        id: gen
        run: |
          {
            echo 'filters<<CATALOG_EOF'
            ./catalog.sh filters
            echo 'CATALOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ${{ steps.gen.outputs.filters }}
      - name: Compute build matrices
        id: compute
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          matrix=$(./catalog.sh matrix "${CHANGES:-[]}")
          {
            echo "registry=$(jq -r '.registry' <<<"$matrix")"
            for s in 0 1 2; do
              echo "stage${s}=$(jq -c ".stages[$s]" <<<"$matrix")"
              echo "any${s}=$(jq -r ".any_stage[$s]" <<<"$matrix")"
            done
          } >> "$GITHUB_OUTPUT"

  build-stage0:
    needs: catalog
    if: needs.catalog.outputs.any0 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.stage0) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: false
          tags: ${{ needs.catalog.outputs.registry }}/${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  build-stage1:
    needs: [catalog, build-stage0]
    if: >-
      always()
      && needs.catalog.outputs.any1 == 'true'
      && (needs.build-stage0.result == 'success' || needs.build-stage0.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.stage1) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke build
        # FROM the published :latest of the in-repo parent. Nothing is
        # pushed here, so a moving :latest costs at most a stale smoke
        # build; the release pipeline resolves the parent by the digest
        # it just pushed instead (catalog.sh baseref).
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: false
          tags: ${{ needs.catalog.outputs.registry }}/${{ matrix.image.name }}:ci
          build-args: |
            BASE_IMAGE=${{ needs.catalog.outputs.registry }}/${{ matrix.image.from }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  build-stage2:
    needs: [catalog, build-stage1]
    if: >-
      always()
      && needs.catalog.outputs.any2 == 'true'
      && (needs.build-stage1.result == 'success' || needs.build-stage1.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.stage2) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: false
          tags: ${{ needs.catalog.outputs.registry }}/${{ matrix.image.name }}:ci
          build-args: |
            BASE_IMAGE=${{ needs.catalog.outputs.registry }}/${{ matrix.image.from }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
