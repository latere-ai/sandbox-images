name: Release Sandbox Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra tag to publish on non-base images (e.g. v0.0.8-rebuild). Empty = use semver/latest only."
        required: false
        type: string
      rebuild_base:
        description: "Also rebuild the base (root) images."
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]

# The image inventory lives in catalog.yaml; this workflow carries no
# image names. Publish to GHCR only on release-producing events (tag
# push, GitHub release, or manual dispatch). Pushes to main run the same
# build matrix as a CI smoke check but do not push the resulting images.
# catalog.json is published to object storage on tag push and release
# only, where every image carries an immutable semver ref.

permissions:
  contents: read
  packages: write

jobs:
  # Lint catalog.yaml, then derive the change filters and the per-stage
  # build matrices (stage 0 = no `from`, stage N = FROM a stage N-1
  # image) from it. Branch pushes build only changed images;
  # release-producing events build everything. Stages are jobs so a
  # child never builds concurrently with the parent it FROMs.
  catalog:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.compute.outputs.registry }}
      stage0: ${{ steps.compute.outputs.stage0 }}
      stage1: ${{ steps.compute.outputs.stage1 }}
      stage2: ${{ steps.compute.outputs.stage2 }}
      any0: ${{ steps.compute.outputs.any0 }}
      any1: ${{ steps.compute.outputs.any1 }}
      any2: ${{ steps.compute.outputs.any2 }}
      push: ${{ steps.compute.outputs.push }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint catalog
        run: |
          ./catalog.sh lint
          bash catalog_test.sh
      - name: Generate change filters
        id: gen
        run: |
          {
            echo 'filters<<CATALOG_EOF'
            ./catalog.sh filters
            echo 'CATALOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        with:
          filters: ${{ steps.gen.outputs.filters }}
      - name: Compute build matrices
        id: compute
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" && "$REF" == refs/heads/* ]]; then
            matrix=$(./catalog.sh matrix "${CHANGES:-[]}")
          else
            matrix=$(./catalog.sh matrix --all)
          fi
          {
            echo "registry=$(jq -r '.registry' <<<"$matrix")"
            for s in 0 1 2; do
              echo "stage${s}=$(jq -c ".stages[$s]" <<<"$matrix")"
              echo "any${s}=$(jq -r ".any_stage[$s]" <<<"$matrix")"
            done
          } >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "release" || ( "$EVENT" == "push" && "$REF" == refs/tags/* ) ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

  # Stage 0: images with no `from`. Publishing runs record each pushed
  # image's digest as an artifact; later stages build FROM that digest
  # rather than :latest, so a re-run or a concurrent release cannot move
  # the parent out from under a child mid-run.
  build-stage0:
    needs: catalog
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.rebuild_base)
      && needs.catalog.outputs.any0 == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.stage0) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.catalog.outputs.registry }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: ${{ needs.catalog.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Record digest
        if: needs.catalog.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digest
          jq -n --arg name '${{ matrix.image.name }}' --arg digest '${{ steps.build.outputs.digest }}' \
            '{name: $name, digest: $digest}' > "/tmp/digest/${{ matrix.image.name }}.json"
      - name: Upload digest
        if: needs.catalog.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}
          path: /tmp/digest/*.json

  build-stage1:
    needs: [catalog, build-stage0]
    if: >-
      always()
      && needs.catalog.outputs.any1 == 'true'
      && (needs.build-stage0.result == 'success' || needs.build-stage0.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.stage1) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download parent digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
        continue-on-error: true

      # A publishing run whose parent stage actually ran must resolve the
      # parent by digest; baseref fails rather than falling back. A
      # dispatch with rebuild_base=false skips stage 0 on purpose and
      # reuses the published :latest.
      - name: Resolve parent image
        id: parent
        env:
          FROM: ${{ matrix.image.from }}
          REQUIRE: ${{ needs.catalog.outputs.push == 'true' && needs.build-stage0.result == 'success' }}
        run: |
          set -euo pipefail
          ref=$(./catalog.sh baseref "$FROM" digests "$REQUIRE")
          echo "Building FROM $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.catalog.outputs.registry }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: ${{ needs.catalog.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.parent.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Record digest
        if: needs.catalog.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digest
          jq -n --arg name '${{ matrix.image.name }}' --arg digest '${{ steps.build.outputs.digest }}' \
            '{name: $name, digest: $digest}' > "/tmp/digest/${{ matrix.image.name }}.json"
      - name: Upload digest
        if: needs.catalog.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}
          path: /tmp/digest/*.json

  build-stage2:
    needs: [catalog, build-stage0, build-stage1]
    if: >-
      always()
      && needs.catalog.outputs.any2 == 'true'
      && (needs.build-stage0.result == 'success' || needs.build-stage0.result == 'skipped')
      && (needs.build-stage1.result == 'success' || needs.build-stage1.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.stage2) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download parent digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
        continue-on-error: true

      - name: Resolve parent image
        id: parent
        env:
          FROM: ${{ matrix.image.from }}
          REQUIRE: ${{ needs.catalog.outputs.push == 'true' && needs.build-stage1.result == 'success' }}
        run: |
          set -euo pipefail
          ref=$(./catalog.sh baseref "$FROM" digests "$REQUIRE")
          echo "Building FROM $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.catalog.outputs.registry }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.image.platforms }}
          push: ${{ needs.catalog.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.parent.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Record digest
        if: needs.catalog.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digest
          jq -n --arg name '${{ matrix.image.name }}' --arg digest '${{ steps.build.outputs.digest }}' \
            '{name: $name, digest: $digest}' > "/tmp/digest/${{ matrix.image.name }}.json"
      - name: Upload digest
        if: needs.catalog.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}
          path: /tmp/digest/*.json

  # Compose catalog.json from catalog.yaml plus the recorded digests and
  # publish it to S3-compatible object storage. Tag push and release
  # only: dispatch builds may carry no immutable semver ref, and the
  # catalog contract pins every image to one.
  # A stage with no images at this depth is skipped, and a skipped need
  # would skip this job too, so the event test runs under always() with
  # the stage results checked explicitly. compose still fails on a
  # missing digest, so a stage that should have produced images cannot
  # publish a half-empty catalog.
  publish-catalog:
    needs: [catalog, build-stage0, build-stage1, build-stage2]
    if: >-
      always()
      && (github.event_name == 'release'
          || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
      && needs.build-stage0.result == 'success'
      && (needs.build-stage1.result == 'success' || needs.build-stage1.result == 'skipped')
      && (needs.build-stage2.result == 'success' || needs.build-stage2.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # An image that declares `packages` in catalog.yaml carries its
      # package list as a file; it is read from the image at the digest this
      # run pushed, so the list published is the one in that image.
      - name: Read package lists
        env:
          RUNTIME: docker
        run: ./catalog.sh packages digests packages
      - name: Compose catalog.json
        id: compose
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          ./catalog.sh compose "$TAG" "$GITHUB_SHA" digests packages > catalog.json
          jq . catalog.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Upload to object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CATALOG_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOG_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CATALOG_S3_REGION }}
          ENDPOINT: ${{ secrets.CATALOG_S3_ENDPOINT }}
          BUCKET: ${{ secrets.CATALOG_S3_BUCKET }}
          PREFIX: ${{ secrets.CATALOG_S3_PREFIX }}
          TAG: ${{ steps.compose.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "$BUCKET" ]]; then
            echo "CATALOG_S3_* secrets are not configured; a release must publish the catalog." >&2
            exit 1
          fi
          aws s3 cp catalog.json "s3://${BUCKET}/${PREFIX}/catalog.json" --endpoint-url "$ENDPOINT"
          aws s3 cp catalog.json "s3://${BUCKET}/${PREFIX}/history/${TAG}.json" --endpoint-url "$ENDPOINT"
