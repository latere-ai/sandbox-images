<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Noto CJK draws Chinese, Japanese, and Korean text, whatever other fonts
  with those glyphs are installed.

  Ubuntu's 65-nonlatin.conf lists WenQuanYi Zen Hei and the IPA fonts ahead
  of Noto CJK for the generic families, and Noto CJK's own 70-fonts-noto-cjk.conf
  binds its faces strongly for Chinese only. With those fonts present,
  Japanese and Korean text, and text with no language set, would be drawn
  with WenQuanYi Zen Hei or IPA Gothic.

  The aliases make Noto Sans CJK the font for these scripts in text with no
  language set. The matches give Japanese and Korean text the Noto CJK face
  for the language, bound as strongly as Noto CJK binds its Chinese faces.
  This file sorts before 64-wqy-zenhei.conf and 65-nonlatin.conf, so its
  aliases come ahead of theirs.
-->
<fontconfig>
    <alias>
        <family>sans-serif</family>
        <prefer><family>Noto Sans CJK JP</family></prefer>
    </alias>
    <alias>
        <family>serif</family>
        <prefer><family>Noto Sans CJK JP</family></prefer>
    </alias>
    <alias>
        <family>monospace</family>
        <prefer><family>Noto Sans CJK JP</family></prefer>
    </alias>
    <match target="pattern">
        <test name="lang"><string>ja</string></test>
        <test name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
    </match>
    <match target="pattern">
        <test name="lang"><string>ja</string></test>
        <test name="family"><string>serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
    </match>
    <match target="pattern">
        <test name="lang"><string>ja</string></test>
        <test name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
    </match>
    <match target="pattern">
        <test name="lang"><string>ko</string></test>
        <test name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
    </match>
    <match target="pattern">
        <test name="lang"><string>ko</string></test>
        <test name="family"><string>serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK KR</string></edit>
    </match>
    <match target="pattern">
        <test name="lang"><string>ko</string></test>
        <test name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
    </match>
</fontconfig>
